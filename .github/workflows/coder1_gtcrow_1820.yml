name: Coder One GTCROW-1820 real GTC ledger and two scratch mutants
on:
  push:
    branches: [gpt/coder1-gtcrow-1820-20261101]
  pull_request:
    branches: [hermes/integration]
permissions:
  contents: read
jobs:
  gtc-pending-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_PIN: 0a99d215c99b794717ce5b34f46cc299dae09106
      HL_LIVE_ENV_FILE: /nonexistent
      HL_LEADER_NETWORK: testnet
      HL_FOLLOWER_NETWORK: testnet
      HL_LIVE_AUTO_SEND_ENABLED: "0"
      HL_LIVE_SCOPE_SWEEP_THREAD: "0"
      HL_LIVE_HL_PRIVATE_KEY: ""
      HL_USER_WALLET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/coder1-gtcrow-1820-20261101
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies before network isolation
        run: |
          python -m pip install -q --disable-pip-version-check requests python-dotenv websocket-client websockets hyperliquid-python-sdk==0.24.0 psutil
      - name: Pin Core, prove no engine edits and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/c1-gtcrow-1820
          git diff --exit-code "$CORE_PIN" HEAD -- _archive/hl_stage2/HL_Live_Copy_Service_Core.py
          test "$(git rev-parse "$CORE_PIN:_archive/hl_stage2/HL_Live_Copy_Service_Core.py")" = e470862a291bbf241e22d8011b757ed9c2b53d68
          test "$(git hash-object _archive/hl_stage2/HL_Live_Copy_Service_Core.py)" = e470862a291bbf241e22d8011b757ed9c2b53d68
          printf 'base=%s\ncandidate=%s\ncore_blob=e470862a291bbf241e22d8011b757ed9c2b53d68\n' "$CORE_PIN" "$(git rev-parse HEAD)" > evidence/c1-gtcrow-1820/provenance.txt
          python -m pip freeze > evidence/c1-gtcrow-1820/dependencies.txt
      - name: Run original and two one-site mutants in independent offline temp directories
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY' | tee evidence/c1-gtcrow-1820/runner.log
          import json,os,pathlib,re,shutil,subprocess,sys,tempfile,time
          root=pathlib.Path.cwd()
          stage=root/"_archive"/"hl_stage2"
          out=root/"evidence"/"c1-gtcrow-1820"
          file="test_core_gtc_refused_pending_lifecycle.py"
          original=(stage/"HL_Live_Copy_Service_Core.py").read_text(encoding="utf-8-sig")
          test_source=(stage/file).read_bytes()
          mutants=[
            ("no_resting_ledger_registration",
             "self._resting_entries[str(oid)] = row",
             "pass  # MUTANT: no resting row in durable registry",
             "GTC_EXACT_ONE_PENDING_LEDGER_ROW_KEYED_LEADER_FILL"),
            ("ignore_existing_resting_duplicate_guard",
             "if self.resting_entry_for(intent.fill.leader_wallet, intent.fill.coin, intent.copy_side) is not None:",
             "if False and self.resting_entry_for(intent.fill.leader_wallet, intent.fill.coin, intent.copy_side) is not None:  # MUTANT",
             "GTC_RETRY_NEVER_DUPLICATES_PHYSICAL_OR_LEDGER"),
          ]
          site="""import socket
          def _network_denied(*args,**kwargs):
              raise RuntimeError('GTCROW_OFFLINE_NETWORK_DENIED')
          socket.socket.connect=_network_denied
          socket.socket.connect_ex=_network_denied
          socket.create_connection=_network_denied
          """
          results=[]
          for name,code,expected in [("original",original,None)]+[
             (label,original.replace(anchor,replace,1),expected)
             for label,anchor,replace,expected in mutants]:
              if name!="original":
                  anchor=next(t[1] for t in mutants if t[0]==name)
                  assert original.count(anchor)==1, (name,original.count(anchor))
              started=time.monotonic()
              work=pathlib.Path(tempfile.mkdtemp(prefix="c1_gtcrow_"))
              try:
                  (work/"HL_Live_Copy_Service_Core.py").write_text(code,encoding="utf-8")
                  (work/file).write_bytes(test_source)
                  (work/"sitecustomize.py").write_text(site,encoding="utf-8")
                  for p in stage.glob("*.py"):
                      if p.name not in {file,"HL_Live_Copy_Service_Core.py","sitecustomize.py"}:
                          (work/p.name).symlink_to(p.resolve())
                  env=os.environ.copy()
                  env.update({"PYTHONPATH":str(work)+os.pathsep+str(stage),"PYTHONDONTWRITEBYTECODE":"1",
                              "HL_LIVE_HL_PRIVATE_KEY":"","HL_LIVE_ENV_FILE":"/nonexistent",
                              "HL_LEADER_NETWORK":"testnet","HL_FOLLOWER_NETWORK":"testnet"})
                  try:
                      p=subprocess.run([sys.executable,"-u",file],cwd=work,env=env,
                          text=True,errors="replace",capture_output=True,timeout=120)
                      rc=p.returncode;raw=p.stdout+"\n=== STDERR ===\n"+p.stderr;timeout=False
                  except subprocess.TimeoutExpired as e:
                      rc=124;raw=repr(e.stdout)+"\n=== TIMEOUT ===\n"+repr(e.stderr);timeout=True
                  (out/(name+".log")).write_text(raw,encoding="utf-8")
                  marks=re.findall(r"RESULT::([A-Za-z0-9_]+)_(PASS|FAIL)(?:\s*\|\s*(.*))?",raw)
                  total=re.findall(r"TOTAL=(\d+)\s+FAILED=(\d+)",raw)
                  info={"case":name,"exit_code":rc,"timeout":timeout,
                        "total":total[-1] if total else None,
                        "passed":[a for a,b,c in marks if b=="PASS"],
                        "failed":[a for a,b,c in marks if b=="FAIL"],
                        "details":[x[:1100] for x in raw.splitlines() if "RESULT::" in x and "_FAIL" in x],
                        "traceback":[x for x in raw.splitlines() if "Traceback" in x or "Error:" in x][:10],
                        "duration_s":round(time.monotonic()-started,2)}
                  if expected: info["expected_red"]=expected in info["failed"]; info["expected_assertion"]=expected
                  results.append(info)
                  print("GTCROW_CASE "+json.dumps(info,sort_keys=True),flush=True)
              finally:
                  shutil.rmtree(work,ignore_errors=True)
          (out/"report.json").write_text(json.dumps(results,indent=2)+"\n")
          base=results[0]
          assert base["total"] is not None and not base["timeout"], "baseline crashed/timeout"
          must_be_green=[
              "GTC_REFUSED_ENTRY_RESTED_WITH_REAL_PHYSICAL_ORDER",
              "GTC_EXACT_ONE_PENDING_LEDGER_ROW_KEYED_LEADER_FILL",
              "GTC_RETRY_NEVER_DUPLICATES_PHYSICAL_OR_LEDGER"]
          assert all(k in base["passed"] for k in must_be_green), "targeted baseline positive controls are not green"
          for m in results[1:]:
              assert m["exit_code"]==1 and m["expected_red"] and m["total"] and not m["timeout"],m
          if base["exit_code"]==0:
              print("GTCROW_FULL_BASELINE_GREEN_AND_TWO_NAMED_MUTANTS_RED=PASS")
          else:
              print("GTCROW_REAL_ENGINE_INVARIANT_GAP: baseline RED (see exact RESULT:: failures); two independent mutants CAUGHT")
          PY
      - name: Verify Core untouched and hash complete evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$CORE_PIN" HEAD -- _archive/hl_stage2/HL_Live_Copy_Service_Core.py
          test "$(git hash-object _archive/hl_stage2/HL_Live_Copy_Service_Core.py)" = e470862a291bbf241e22d8011b757ed9c2b53d68
          echo CORE_UNTOUCHED=PASS > evidence/c1-gtcrow-1820/core-unchanged.txt
          (cd evidence/c1-gtcrow-1820 && sha256sum *.json *.txt *.log > SHA256SUMS.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coder1-gtcrow-1820-original-and-two-mutants
          path: evidence/c1-gtcrow-1820
          if-no-files-found: warn
