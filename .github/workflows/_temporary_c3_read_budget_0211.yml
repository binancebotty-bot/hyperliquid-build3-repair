name: Temporary C3 Read Budget Offline Evidence
on:
  push:
    branches:
      - gpt/implementer-2-readtests-0211
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute test-only offline fake HTTP cases
        shell: bash
        run: |
          set -euo pipefail
          python --version
          cd _archive/hl_stage2
          python -u test_core_read_budget_vs_send.py 2>&1 | tee /tmp/read_budget_send.log
          echo "TEST_EXIT=${PIPESTATUS[0]}"
          sha256sum test_core_read_budget_vs_send.py HL_Live_Copy_Service_Core.py headroom.py exchange_truth.py
          echo "SENDING_OR_NETWORK_PROHIBITED=1"
