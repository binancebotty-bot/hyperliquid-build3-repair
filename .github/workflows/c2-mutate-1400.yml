name: C2 MUTATE 1400 disposable Core sensitivity
on:
  push:
    branches:
      - gpt/tests-b-mutate-1400-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-suite-disposable-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PINNED_CORE_SHA: 0a99d215c99b794717ce5b34f46cc299dae09106
      CODER_ONE_TEST_SHA: ad384e4922c5e9707abeb072d6ec502bc7691c9f
      HL_LIVE_ENV_FILE: /nonexistent
      HL_LEADER_NETWORK: testnet
      HL_FOLLOWER_NETWORK: testnet
      HL_LIVE_AUTO_SEND_ENABLED: "0"
      HL_LIVE_SCOPE_SWEEP_THREAD: "0"
      HL_LIVE_HL_PRIVATE_KEY: ""
      HL_USER_WALLET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen test-run dependencies before outbound socket lockdown
        run: |
          python -m pip install --disable-pip-version-check -q requests python-dotenv websocket-client websockets hyperliquid-python-sdk==0.24.0 psutil
      - name: Verify EXACT source Core and all six latest Coder One test blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/c2-mutate-1400
          python -m pip freeze > evidence/c2-mutate-1400/dependencies.txt
          test "$(git hash-object _archive/hl_stage2/HL_Live_Copy_Service_Core.py)" = "c48fbc52e158baef17fb6d620b335e632652c73a"
          test "$(git rev-parse "$PINNED_CORE_SHA:_archive/hl_stage2/HL_Live_Copy_Service_Core.py")" = "c48fbc52e158baef17fb6d620b335e632652c73a"
          for short in append_truncate disk_full liq_parity margin_gate_and_single_terminal off_path_skip r1_cursor; do
            f="_archive/hl_stage2/test_core_"$short".py"
            expected=$(git rev-parse "$CODER_ONE_TEST_SHA:$f")
            actual=$(git hash-object "$f")
            printf '%s expected=%s actual=%s\n' "$f" "$expected" "$actual" | tee -a evidence/c2-mutate-1400/blobs.txt
            test "$expected" = "$actual"
          done
          git status --short > evidence/c2-mutate-1400/git-status-before.txt
      - name: Run 6 pristine baselines plus 18 throwaway mutations without outbound sockets
        shell: bash
        run: |
          set -euo pipefail
          python -u .github/scripts/c2_mutate_1400.py | tee evidence/c2-mutate-1400/runner.log
      - name: Prove tracked Core was never edited
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- _archive/hl_stage2/HL_Live_Copy_Service_Core.py
          test "$(git hash-object _archive/hl_stage2/HL_Live_Copy_Service_Core.py)" = "c48fbc52e158baef17fb6d620b335e632652c73a"
          echo CORE_UNMODIFIED=PASS | tee evidence/c2-mutate-1400/core-unchanged.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-mutate-1400-source-verified-logs
          path: evidence/c2-mutate-1400
          if-no-files-found: error
          retention-days: 30
